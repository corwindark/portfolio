<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="Corwin Dark - Data Science Portfolio. Machine learning, financial markets, and applied statistics.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Prism.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  
  <style>
    :root {
      /* Color palette - warm dark theme inspired by Solar */
      --bg-primary: #0a0f14;
      --bg-secondary: #111921;
      --bg-tertiary: #1a2633;
      --bg-card: #141c26;
      --bg-card-hover: #1d2836;
      
      --text-primary: #e8e6e3;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      
      --accent-primary: #f59e0b;
      --accent-secondary: #d97706;
      --accent-tertiary: #92400e;
      --accent-glow: rgba(245, 158, 11, 0.15);
      
      --border-color: #2a3744;
      --border-light: #374151;
      
      /* Semantic colors */
      --success: #10b981;
      --info: #3b82f6;
      --warning: #f59e0b;
      
      /* Typography */
      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      
      /* Spacing */
      --sidebar-width: 280px;
      --content-max-width: 900px;
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --spacing-2xl: 3rem;
      
      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
      --transition-slow: 400ms ease;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 20px var(--accent-glow);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Geometric background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(245, 158, 11, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.02) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      pointer-events: none;
      z-index: -1;
    }
    
    a {
      color: var(--accent-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    
    a:hover {
      color: var(--accent-secondary);
    }
    
    /* Navigation */
    .nav-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }
    
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing-md) var(--spacing-xl);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .nav-logo {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    
    .nav-logo::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-primary);
    }
    
    .nav-links {
      display: flex;
      gap: var(--spacing-xl);
      list-style: none;
    }
    
    .nav-links a {
      color: var(--text-secondary);
      font-weight: 500;
      padding: var(--spacing-sm) 0;
      position: relative;
    }
    
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent-primary);
      transition: width var(--transition-normal);
    }
    
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-primary);
    }
    
    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }
    
    .nav-social {
      display: flex;
      gap: var(--spacing-md);
    }
    
    .nav-social a {
      color: var(--text-muted);
      font-size: 1.25rem;
      transition: color var(--transition-fast), transform var(--transition-fast);
    }
    
    .nav-social a:hover {
      color: var(--accent-primary);
      transform: translateY(-2px);
    }
    
    /* Main layout */
    .main-layout {
      display: flex;
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      padding: var(--spacing-2xl) var(--spacing-lg);
      position: sticky;
      top: 80px;
      height: calc(100vh - 80px);
      overflow-y: auto;
      border-right: 1px solid var(--border-color);
      transition: opacity var(--transition-normal);
    }
    
    .sidebar-content {
      text-align: center;
    }
    
    .sidebar-image {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border-color);
      margin-bottom: var(--spacing-lg);
      transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
    }
    
    .sidebar-image:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-glow);
    }
    
    .sidebar-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: var(--spacing-sm);
    }
    
    .sidebar-bio {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .sidebar-era-indicator {
      margin-top: var(--spacing-xl);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--border-color);
    }
    
    .era-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      margin-right: var(--spacing-sm);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Main content */
    .main-content {
      flex: 1;
      padding: var(--spacing-2xl);
      max-width: var(--content-max-width);
    }
    
    /* Intro section */
    .intro {
      margin-bottom: var(--spacing-2xl);
      padding-bottom: var(--spacing-2xl);
      border-bottom: 1px solid var(--border-color);
    }
    
    .intro h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: var(--spacing-md);
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .intro-text {
      font-size: 1.125rem;
      color: var(--text-secondary);
      max-width: 600px;
    }
    
    /* Label filters */
    .label-filters {
      margin-bottom: var(--spacing-xl);
    }
    
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }
    
    .label-filter {
      padding: var(--spacing-xs) var(--spacing-md);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .label-filter:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }
    
    .label-filter.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: var(--bg-primary);
      font-weight: 500;
    }
    
    /* Projects feed */
    .projects-feed {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }
    
    /* Sidebar Timeline */
    .sidebar-timeline {
      position: relative;
      margin-top: var(--spacing-xl);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--border-color);
    }
    
    .timeline-track {
      position: absolute;
      left: 23px;
      top: var(--spacing-lg);
      bottom: 0;
      width: 2px;
      background: var(--border-color);
    }
    
    .timeline-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-md);
      padding-bottom: var(--spacing-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .timeline-item:last-child {
      padding-bottom: 0;
    }
    
    .timeline-logo {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-color);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      z-index: 1;
    }
    
    .timeline-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .timeline-logo-placeholder {
      font-size: 1.25rem;
      color: var(--text-muted);
    }
    
    .timeline-item.active .timeline-logo {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    
    .timeline-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 4px;
    }
    
    .timeline-year {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: color var(--transition-fast);
    }
    
    .timeline-item.active .timeline-year {
      color: var(--accent-primary);
    }
    
    .timeline-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.3;
    }
    
    .timeline-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    
    .timeline-item:hover .timeline-logo {
      border-color: var(--accent-secondary);
    }
    
    .timeline-item:hover .timeline-year {
      color: var(--text-primary);
    }
    
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all var(--transition-normal);
    }
    
    .project-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .project-card.featured {
      border-color: var(--accent-tertiary);
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(245, 158, 11, 0.05) 100%);
    }
    
    .project-card.featured::before {
      content: '★ Featured';
      position: absolute;
      top: var(--spacing-md);
      right: var(--spacing-md);
      background: var(--accent-primary);
      color: var(--bg-primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    
    .project-card {
      position: relative;
    }
    
    .project-link {
      display: flex;
      color: inherit;
      text-decoration: none;
    }
    
    .project-image {
      width: 200px;
      min-height: 160px;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-normal);
    }
    
    .project-image.no-image {
      background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
    }
    
    .project-image.no-image::after {
      content: '📊';
      font-size: 3rem;
      opacity: 0.3;
    }
    
    .project-card:hover .project-image img {
      transform: scale(1.05);
    }
    
    .project-content {
      padding: var(--spacing-lg);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .project-content time {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    
    .project-content h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: var(--spacing-xs) 0 var(--spacing-sm);
      color: var(--text-primary);
      transition: color var(--transition-fast);
    }
    
    .project-card:hover .project-content h3 {
      color: var(--accent-primary);
    }
    
    .project-content p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .project-labels {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
      margin-top: var(--spacing-md);
    }
    
    .label {
      font-size: 0.75rem;
      padding: 2px 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    
    /* Resume page */
    .resume-section {
      max-width: 900px;
    }
    
    .resume-section h1 {
      font-size: 2rem;
      margin-bottom: var(--spacing-lg);
    }
    
    .resume-actions {
      margin-bottom: var(--spacing-xl);
    }
    
    .btn {
      display: inline-block;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: 8px;
      font-weight: 500;
      text-decoration: none;
      transition: all var(--transition-fast);
    }
    
    .btn-primary {
      background: var(--accent-primary);
      color: var(--bg-primary);
    }
    
    .btn-primary:hover {
      background: var(--accent-secondary);
      color: var(--bg-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .resume-embed {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }
    
    .resume-embed iframe {
      display: block;
      border: none;
    }
    
    /* Blog styles */
    .blog-header {
      margin-bottom: var(--spacing-2xl);
      padding-bottom: var(--spacing-xl);
      border-bottom: 1px solid var(--border-color);
    }
    
    .blog-header h1 {
      font-size: 2rem;
      margin-bottom: var(--spacing-md);
    }
    
    .blog-intro {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }
    
    .blog-posts {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }
    
    .blog-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: var(--spacing-lg);
      transition: all var(--transition-normal);
    }
    
    .blog-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
      transform: translateX(4px);
    }
    
    .blog-card a {
      color: inherit;
      text-decoration: none;
    }
    
    .blog-card time {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    
    .series-badge {
      display: inline-block;
      margin-left: var(--spacing-md);
      padding: 2px 8px;
      background: var(--accent-tertiary);
      color: var(--accent-primary);
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 4px;
    }
    
    .blog-card h3 {
      font-size: 1.25rem;
      margin: var(--spacing-sm) 0;
      color: var(--text-primary);
    }
    
    .blog-card:hover h3 {
      color: var(--accent-primary);
    }
    
    .blog-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    
    /* Code blocks */
    .code-collapse {
      margin: var(--spacing-lg) 0;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    
    .code-collapse summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--bg-tertiary);
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    
    .code-collapse summary::-webkit-details-marker {
      display: none;
    }
    
    .code-title {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    
    .toggle-icon {
      color: var(--text-muted);
      transition: transform var(--transition-fast);
    }
    
    .code-collapse[open] .toggle-icon {
      transform: rotate(180deg);
    }
    
    .code-content {
      padding: 0;
    }
    
    .code-content pre {
      margin: 0;
      border-radius: 0;
    }
    
    pre {
      background: var(--bg-secondary) !important;
      padding: var(--spacing-lg);
      overflow-x: auto;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    
    code {
      font-family: var(--font-mono);
    }
    
    /* Iframe container */
    .iframe-container {
      margin: var(--spacing-xl) 0;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-secondary);
    }
    
    .iframe-container iframe {
      display: block;
    }
    
    /* Footer */
    .site-footer {
      margin-top: auto;
      padding: var(--spacing-xl);
      border-top: 1px solid var(--border-color);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    
    /* Mobile responsive */
    @media (max-width: 1024px) {
      .sidebar {
        display: none;
      }
      
      .main-content {
        max-width: 100%;
      }
    }
    
    @media (max-width: 768px) {
      .nav-container {
        padding: var(--spacing-md);
      }
      
      .nav-links {
        gap: var(--spacing-md);
      }
      
      .main-content {
        padding: var(--spacing-lg);
      }
      
      .intro h1 {
        font-size: 1.75rem;
      }
      
      .project-link {
        flex-direction: column;
      }
      
      .project-image {
        width: 100%;
        height: 180px;
      }
    }
    
    /* Hidden class for filtering */
    .project-card.hidden {
      display: none;
    }
    
    /* Smooth transitions for filter */
    .project-card {
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- Prism.js for syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-r.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
  
  {{ sidebarErasScript }}
  
  <script>
    // Label filtering
    document.querySelectorAll('.label-filter').forEach(button => {
      button.addEventListener('click', function() {
        const filter = this.dataset.filter;
        
        // Update active state
        document.querySelectorAll('.label-filter').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        // Filter projects
        document.querySelectorAll('.project-card').forEach(card => {
          if (filter === 'all') {
            card.classList.remove('hidden');
          } else {
            const labels = card.dataset.labels.split(',');
            if (labels.includes(filter)) {
              card.classList.remove('hidden');
            } else {
              card.classList.add('hidden');
            }
          }
        });
      });
    });
    
    // Blog timeline scrolling (only on blog index page)
    if (document.querySelector('.blog-index-page')) {
      const timelineItems = document.querySelectorAll('.timeline-item');
      const blogCards = document.querySelectorAll('.blog-card');
      
      if (timelineItems.length > 0 && blogCards.length > 0) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const cardYear = new Date(entry.target.dataset.date).getFullYear();
              
              // Update timeline items
              timelineItems.forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.year) === cardYear) {
                  item.classList.add('active');
                }
              });
            }
          });
        }, {
          threshold: 0.3,
          rootMargin: '-100px 0px -50% 0px'
        });
        
        blogCards.forEach(card => {
          observer.observe(card);
        });
        
        // Set initial active item based on first post
        if (blogCards.length > 0) {
          const firstYear = new Date(blogCards[0].dataset.date).getFullYear();
          timelineItems.forEach(item => {
            if (parseInt(item.dataset.year) === firstYear) {
              item.classList.add('active');
            }
          });
        }
        
        // Click on timeline item to scroll to first post of that year
        timelineItems.forEach(item => {
          item.addEventListener('click', () => {
            const year = item.dataset.year;
            const targetCard = document.querySelector(`.blog-card[data-year="${year}"]`);
            if (targetCard) {
              targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          });
        });
      }
    }
    
    // Sidebar timeline scrolling (only on home page)
    if (document.querySelector('.home-page')) {
      const timelineItems = document.querySelectorAll('.timeline-item');
      const projectCards = document.querySelectorAll('.project-card');
      
      if (timelineItems.length > 0 && projectCards.length > 0) {
        // Get timeline start years sorted descending
        const timelineYears = Array.from(timelineItems).map(item => ({
          element: item,
          startYear: parseInt(item.dataset.startYear)
        })).sort((a, b) => b.startYear - a.startYear);
        
        // Find which timeline entry a project year belongs to
        function findTimelineEntry(projectYear) {
          for (const entry of timelineYears) {
            if (projectYear >= entry.startYear) {
              return entry.element;
            }
          }
          return timelineYears[timelineYears.length - 1]?.element;
        }
        
        // Track which year is currently most visible
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const year = parseInt(entry.target.dataset.year);
              const matchingEntry = findTimelineEntry(year);
              
              // Update timeline items
              timelineItems.forEach(item => item.classList.remove('active'));
              if (matchingEntry) {
                matchingEntry.classList.add('active');
              }
            }
          });
        }, {
          threshold: 0.3,
          rootMargin: '-100px 0px -50% 0px'
        });
        
        projectCards.forEach(card => {
          observer.observe(card);
        });
        
        // Set initial active item based on first visible project
        if (projectCards.length > 0) {
          const firstYear = parseInt(projectCards[0].dataset.year);
          const matchingEntry = findTimelineEntry(firstYear);
          if (matchingEntry) {
            matchingEntry.classList.add('active');
          }
        }
        
        // Click on timeline item to scroll to first project within that era
        timelineItems.forEach(item => {
          item.addEventListener('click', () => {
            const startYear = parseInt(item.dataset.startYear);
            // Find first project card with year >= startYear
            const targetCard = Array.from(projectCards).find(card => {
              const cardYear = parseInt(card.dataset.year);
              return cardYear >= startYear;
            });
            if (targetCard) {
              targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          });
        });
      }
    }
    
    // Highlight code on page load
    if (typeof Prism !== 'undefined') {
      Prism.highlightAll();
    }
  </script>
